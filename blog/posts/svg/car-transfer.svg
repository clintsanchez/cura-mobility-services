<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" role="img" aria-label="Five steps for helping a parent into a car. One, park on level ground with room to open the door fully and slide the seat back. Two, have your parent back up until they feel the seat behind their legs. Three, they reach back for a steady surface, not the door, and sit down first. Four, lift and swing both legs in together. Five, fold the walker or wheelchair and stow it.">
  <rect width="1080" height="420" rx="20" fill="#F3F6F9"/>
  <text x="540" y="58" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#02265A">Getting into the car: sit first, then swing in</text>
  <g font-family="Atkinson Hyperlegible, Verdana, sans-serif">
    <g>
      <rect x="30" y="96" width="192" height="262" rx="14" fill="white" stroke="#DDE3EA" stroke-width="2"/>
      <circle cx="126" cy="150" r="30" fill="#02265A"/><text x="126" y="160" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="700" fill="white">1</text>
      <text x="126" y="220" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#02265A">Set up</text>
      <text x="126" y="262" text-anchor="middle" font-size="17" fill="#1A2433">Level ground,</text>
      <text x="126" y="286" text-anchor="middle" font-size="17" fill="#1A2433">door wide open,</text>
      <text x="126" y="310" text-anchor="middle" font-size="17" fill="#1A2433">seat slid back</text>
    </g>
    <g>
      <rect x="241" y="96" width="192" height="262" rx="14" fill="white" stroke="#DDE3EA" stroke-width="2"/>
      <circle cx="337" cy="150" r="30" fill="#02265A"/><text x="337" y="160" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="700" fill="white">2</text>
      <text x="337" y="220" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#02265A">Back up</text>
      <text x="337" y="262" text-anchor="middle" font-size="17" fill="#1A2433">Step back until</text>
      <text x="337" y="286" text-anchor="middle" font-size="17" fill="#1A2433">the seat touches</text>
      <text x="337" y="310" text-anchor="middle" font-size="17" fill="#1A2433">the back of</text>
      <text x="337" y="334" text-anchor="middle" font-size="17" fill="#1A2433">the legs</text>
    </g>
    <g>
      <rect x="452" y="96" width="192" height="262" rx="14" fill="white" stroke="#DDE3EA" stroke-width="2"/>
      <circle cx="548" cy="150" r="30" fill="#02265A"/><text x="548" y="160" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="700" fill="white">3</text>
      <text x="548" y="220" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#02265A">Sit first</text>
      <text x="548" y="262" text-anchor="middle" font-size="17" fill="#1A2433">Reach back for</text>
      <text x="548" y="286" text-anchor="middle" font-size="17" fill="#1A2433">a steady surface,</text>
      <text x="548" y="310" text-anchor="middle" font-size="17" fill="#1A2433">never the door,</text>
      <text x="548" y="334" text-anchor="middle" font-size="17" fill="#1A2433">and sit down</text>
    </g>
    <g>
      <rect x="663" y="96" width="192" height="262" rx="14" fill="white" stroke="#DDE3EA" stroke-width="2"/>
      <circle cx="759" cy="150" r="30" fill="#02265A"/><text x="759" y="160" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="700" fill="white">4</text>
      <text x="759" y="220" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#02265A">Swing in</text>
      <text x="759" y="262" text-anchor="middle" font-size="17" fill="#1A2433">Turn and bring</text>
      <text x="759" y="286" text-anchor="middle" font-size="17" fill="#1A2433">both legs in</text>
      <text x="759" y="310" text-anchor="middle" font-size="17" fill="#1A2433">together</text>
    </g>
    <g>
      <rect x="874" y="96" width="176" height="262" rx="14" fill="#E6F4F4" stroke="#047878" stroke-width="2"/>
      <circle cx="962" cy="150" r="30" fill="#047878"/><text x="962" y="160" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="700" fill="white">5</text>
      <text x="962" y="220" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#02265A">Stow it</text>
      <text x="962" y="262" text-anchor="middle" font-size="17" fill="#1A2433">Fold the walker</text>
      <text x="962" y="286" text-anchor="middle" font-size="17" fill="#1A2433">or chair and</text>
      <text x="962" y="310" text-anchor="middle" font-size="17" fill="#1A2433">buckle up</text>
    </g>
  </g>
  <text x="540" y="392" text-anchor="middle" font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-size="16" fill="#5A6675">Getting out works in reverse: legs out first, then stand with the walker in front.</text>
</svg>
