<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" role="img" aria-label="Discharge day timeline in four steps. The day before: ask for the expected discharge time, the medication list and follow-up appointments. Discharge morning: bring clothes, shoes and any walker or wheelchair, and confirm the ride. The ride home: plan a pharmacy stop and keep the discharge papers handy. First 24 hours: someone stays nearby, medicines are sorted and the follow-up visit is booked.">
  <rect width="1080" height="480" rx="20" fill="#F3F6F9"/>
  <text x="540" y="58" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#02265A">Discharge day, step by step</text>
  <line x1="150" y1="130" x2="930" y2="130" stroke="#047878" stroke-width="4"/>
  <g font-family="Montserrat, Arial, sans-serif" font-weight="700" fill="white" font-size="22" text-anchor="middle">
    <circle cx="150" cy="130" r="26" fill="#02265A"/><text x="150" y="138">1</text>
    <circle cx="410" cy="130" r="26" fill="#02265A"/><text x="410" y="138">2</text>
    <circle cx="670" cy="130" r="26" fill="#02265A"/><text x="670" y="138">3</text>
    <circle cx="930" cy="130" r="26" fill="#047878"/><text x="930" y="138">4</text>
  </g>
  <g font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="20" fill="#02265A" text-anchor="middle">
    <text x="150" y="196">The day before</text>
    <text x="410" y="196">Discharge morning</text>
    <text x="670" y="196">The ride home</text>
    <text x="930" y="196">First 24 hours</text>
  </g>
  <g font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-size="17" fill="#1A2433" text-anchor="middle">
    <text x="150" y="240">Ask the expected</text><text x="150" y="264">discharge time</text>
    <text x="150" y="304">Ask for the</text><text x="150" y="328">medication list</text>
    <text x="150" y="368">Book the ride</text>

    <text x="410" y="240">Bring clothes, shoes</text><text x="410" y="264">and a coat</text>
    <text x="410" y="304">Bring the walker</text><text x="410" y="328">or wheelchair</text>
    <text x="410" y="368">Confirm the pickup</text>

    <text x="670" y="240">Keep discharge</text><text x="670" y="264">papers handy</text>
    <text x="670" y="304">Plan a pharmacy</text><text x="670" y="328">stop</text>
    <text x="670" y="368">Go straight home</text>

    <text x="930" y="240">Someone stays</text><text x="930" y="264">nearby</text>
    <text x="930" y="304">Sort the new</text><text x="930" y="328">medicines</text>
    <text x="930" y="368">Book the follow-up</text>
  </g>
  <text x="540" y="444" text-anchor="middle" font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-size="16" fill="#5A6675">Follow the care team's instructions for your parent. They come first.</text>
</svg>
