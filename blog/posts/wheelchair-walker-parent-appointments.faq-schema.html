<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Should my parent bring their own wheelchair to the appointment?", "acceptedAnswer": {"@type": "Answer", "text": "Usually, yes, if the chair fits in the car and your parent is comfortable in it. Their own chair is fitted to them. Some clinics and hospitals keep wheelchairs at the entrance, but availability varies. Call ahead to ask, and tell the ride service if the chair needs to come along."}}, {"@type": "Question", "name": "How do I help my parent into a car without hurting my back?", "acceptedAnswer": {"@type": "Answer", "text": "Let your parent do as much as they safely can. Stand close, bend your knees and keep your back straight rather than lifting. Have them back up to the seat, hold the seat or car frame and sit first. If you find yourself lifting most of their weight, ask a physical therapist for a safer method."}}, {"@type": "Question", "name": "What if my parent cannot manage the steps at home?", "acceptedAnswer": {"@type": "Answer", "text": "Talk with their doctor about a home safety check or physical therapy, which can help with steps and transfers. In the meantime, tell anyone driving your parent about the steps before pickup, so they can plan extra time and help. Some families add a sturdy handrail or a portable ramp."}}, {"@type": "Question", "name": "Can a caregiver ride along to the appointment?", "acceptedAnswer": {"@type": "Answer", "text": "In most cases, yes. Mention it when you book so there is room for you and the mobility aid. Riding along lets you help at check-in, take notes during the visit and ask questions your parent may forget. It also gives your parent a familiar face on a hard day."}}, {"@type": "Question", "name": "How can I tell if my parent is at higher risk of falling?", "acceptedAnswer": {"@type": "Answer", "text": "Watch for a new shuffle, holding onto furniture to walk, dizziness when standing or a recent fall they did not mention. The CDC notes less than half of older people who fall tell their doctor. Share what you see with their doctor, who can check balance, vision and medications."}}]}</script>
